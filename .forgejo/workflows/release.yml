name: release

# Stable GUI release for the bakery channel. The daemon keeps its own signed
# update channel (deploy/release.sh); this workflow ships only the desktop app.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    if: ${{ !contains(github.ref_name, '-rc.') }}
    runs-on: [self-hosted]
    steps:
      - name: checkout
        run: |
          set -euo pipefail
          rm -rf src && mkdir src
          git clone --branch "${GITHUB_REF_NAME}" --depth 1 \
            "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" src

      # Tauri embeds frontend/build at compile time through the default
      # custom-protocol feature, so the site has to exist before cargo runs.
      - name: build frontend
        run: |
          set -euo pipefail
          cd src/gui/frontend
          npm ci
          npm run build

      - name: build
        run: cd src/gui/src && cargo build --release --locked

      - name: prepare artifacts
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_DIR="/srv/breadway-dl/egress-gui/${VERSION}"
          mkdir -p "${PKG_DIR}"
          cp "src/gui/src/target/release/egress-gui" "${PKG_DIR}/egress-gui-x86_64"
          strip "${PKG_DIR}/egress-gui-x86_64"
          sha256sum "${PKG_DIR}/egress-gui-x86_64" | awk '{print $1}' \
            > "${PKG_DIR}/egress-gui-x86_64.sha256"
          cp src/packaging/egress-gui.desktop "${PKG_DIR}/"
          cp src/bakery.toml "${PKG_DIR}/bakery.toml"
          ln -sfn "${VERSION}" "/srv/breadway-dl/egress-gui/latest"

      - name: regenerate index.json
        env:
          MINISIGN_SEC_KEY: ${{ secrets.BAKERY_MINISIGN_SEC_KEY_PATH }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SEC_KEY:-}" ]; then
            echo "::error::BAKERY_MINISIGN_SEC_KEY_PATH secret not set: refusing to regenerate index.json unsigned"
            exit 1
          fi
          ECOSYSTEM_CI_DIR="$(mktemp -d /tmp/bread-ecosystem-ci-XXXXXX)"
          trap 'rm -rf "${ECOSYSTEM_CI_DIR}"' EXIT
          git clone --branch main https://git.breadway.dev/Breadway/bread-ecosystem.git "${ECOSYSTEM_CI_DIR}"
          TRACK=stable bash "${ECOSYSTEM_CI_DIR}/scripts/gen-index.sh"

      - name: assert the package is in the index
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          with open("/srv/breadway-dl/index.json") as f:
              data = json.load(f)
          packages = data.get("packages", {})
          assert "egress-gui" in packages, "egress-gui missing from index.json"
          print("index contains egress-gui", packages["egress-gui"]["version"])
          PY

      - name: upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "no GH_RELEASE_TOKEN; dl.breadway.dev is the only mirror"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_DIR="/srv/breadway-dl/egress-gui/${VERSION}"
          gh release create "${GITHUB_REF_NAME}" --repo Breadway/egress \
            --title "egress ${VERSION}" --generate-notes 2>/dev/null || true
          gh release upload "${GITHUB_REF_NAME}" --repo Breadway/egress \
            "${PKG_DIR}/egress-gui-x86_64" \
            "${PKG_DIR}/egress-gui-x86_64.sha256" \
            --clobber

  windows:
    if: ${{ !contains(github.ref_name, '-rc.') }}
    runs-on: [self-hosted]
    steps:
      - name: checkout
        run: |
          set -euo pipefail
          rm -rf src && mkdir src
          git clone --branch "${GITHUB_REF_NAME}" --depth 1 \
            "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" src

      - name: build frontend
        run: |
          set -euo pipefail
          cd src/gui/frontend
          npm ci
          npm run build

      - name: windows toolchain
        run: |
          set -euo pipefail
          command -v cargo-xwin >/dev/null 2>&1 || cargo install cargo-xwin
          rustup target add x86_64-pc-windows-msvc >/dev/null
          # cargo-xwin supplies the MSVC headers and libraries, but the C
          # compiler and the resource compiler come from the host.
          command -v clang-cl >/dev/null 2>&1 \
            || { echo "::error::clang-cl is missing: install clang and make clang-cl available on the runner"; exit 1; }
          command -v llvm-rc >/dev/null 2>&1 \
            || { echo "::error::llvm-rc is missing: install the llvm package on the runner"; exit 1; }
          command -v lld-link >/dev/null 2>&1 \
            || { echo "::error::lld-link is missing: install lld on the runner"; exit 1; }

      - name: build windows
        run: cd src/gui/src && cargo xwin build --release --locked --target x86_64-pc-windows-msvc

      - name: package windows
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_DIR="/srv/breadway-dl/egress-gui/${VERSION}"
          mkdir -p "${PKG_DIR}"
          cp "src/gui/src/target/x86_64-pc-windows-msvc/release/egress-gui.exe" \
            "${PKG_DIR}/egress-gui-windows-x86_64.exe"
          STAGE="$(mktemp -d)"
          trap 'rm -rf "${STAGE}"' EXIT
          mkdir -p "${STAGE}/egress-gui-${VERSION}-windows-x86_64"
          cp "src/gui/src/target/x86_64-pc-windows-msvc/release/egress-gui.exe" \
            "${STAGE}/egress-gui-${VERSION}-windows-x86_64/egress-gui.exe"
          cp src/deploy/windows-gui-README.txt \
            "${STAGE}/egress-gui-${VERSION}-windows-x86_64/README.txt"
          python3 - "${STAGE}/egress-gui-${VERSION}-windows-x86_64" \
            "${PKG_DIR}/egress-gui-${VERSION}-windows-x86_64.zip" <<'PY'
          import pathlib
          import sys
          import zipfile
          src, out = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as archive:
              for path in src.rglob("*"):
                  archive.write(path, path.relative_to(src.parent))
          PY
          (cd "${PKG_DIR}" && sha256sum "egress-gui-windows-x86_64.exe" \
            "egress-gui-${VERSION}-windows-x86_64.zip" \
            > "egress-gui-${VERSION}-windows-x86_64.sha256")
