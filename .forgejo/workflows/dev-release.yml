name: dev release

# Publishes a GUI dev build on every main push that touches the app. The
# daemon has its own signed update channel and is not published here.
on:
  push:
    branches: ["main"]
    paths:
      - "gui/**"
      - "bakery.toml"
      - "packaging/**"
      - ".forgejo/workflows/dev-release.yml"

jobs:
  build:
    runs-on: [self-hosted]
    steps:
      - name: checkout
        run: |
          set -euo pipefail
          rm -rf src && mkdir src
          git clone --branch main --depth 1 \
            "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" src

      - name: build frontend
        run: |
          set -euo pipefail
          cd src/gui/frontend
          npm ci
          npm run build

      - name: build
        run: cd src/gui/src && cargo build --release --locked

      - name: compute dev version
        run: |
          set -euo pipefail
          cd src
          LATEST_TAG="$(git ls-remote --tags --refs \
            "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" 'v*' \
            | awk -F/ '{print $NF}' | sed 's/^v//' | (grep -v -- '-' || true) | sort -V | tail -1)"
          if [ -n "${LATEST_TAG}" ]; then
            CUR="${LATEST_TAG}"
          else
            CUR="$(grep -m1 '^version' gui/src/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          fi
          IFS='.' read -r MA MI PA <<< "${CUR}"
          SHA="$(git rev-parse --short HEAD)"
          TS="$(date -u +%Y%m%d%H%M%S)"
          echo "VERSION=${MA}.${MI}.$((PA + 1))-dev.${TS}+${SHA}" >> "$GITHUB_ENV"

      - name: prepare artifacts
        run: |
          set -euo pipefail
          PKG_DIR="/srv/breadway-dl/dev/egress-gui/${VERSION}"
          mkdir -p "${PKG_DIR}"
          cp "src/gui/src/target/release/egress-gui" "${PKG_DIR}/egress-gui-x86_64"
          strip "${PKG_DIR}/egress-gui-x86_64"
          sha256sum "${PKG_DIR}/egress-gui-x86_64" | awk '{print $1}' \
            > "${PKG_DIR}/egress-gui-x86_64.sha256"
          cp src/bakery.toml "${PKG_DIR}/bakery.toml"
          cp src/packaging/egress-gui.desktop "${PKG_DIR}/"
          ln -sfn "${VERSION}" "/srv/breadway-dl/dev/egress-gui/latest"

      - name: regenerate dev index
        env:
          MINISIGN_SEC_KEY: ${{ secrets.BAKERY_MINISIGN_SEC_KEY_PATH }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SEC_KEY:-}" ]; then
            echo "::error::BAKERY_MINISIGN_SEC_KEY_PATH secret not set: refusing to regenerate dev index.json unsigned"
            exit 1
          fi
          ECOSYSTEM_CI_DIR="$(mktemp -d /tmp/bread-ecosystem-dev-XXXXXX)"
          trap 'rm -rf "${ECOSYSTEM_CI_DIR}"' EXIT
          git clone --branch main https://git.breadway.dev/Breadway/bread-ecosystem.git "${ECOSYSTEM_CI_DIR}"
          TRACK=dev bash "${ECOSYSTEM_CI_DIR}/scripts/gen-index.sh"

      - name: assert the dev package is in the index
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          with open("/srv/breadway-dl/dev/index.json") as f:
              data = json.load(f)
          package = data.get("packages", {}).get("egress-gui")
          assert package, "egress-gui missing from the dev index"
          print("dev index contains egress-gui", package["version"])
          PY
