name: check

on:
  push:
  pull_request:

jobs:
  root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: vet windows
        run: GOOS=windows go vet ./...
      - name: vet darwin
        run: GOOS=darwin go vet ./...
      - name: test
        run: go test -count=1 ./...
      - name: task script syntax
        # The generated scheduled-task scripts are build strings; parse them
        # with PowerShell when the runner has it, so a syntax mistake fails
        # here instead of on a Windows install.
        run: |
          if ! command -v pwsh >/dev/null 2>&1; then
            echo "pwsh unavailable on this runner; skipping"
            exit 0
          fi
          go test -run TestWindowsTaskScriptParses -count=1 -v ./internal/egress
      - name: clean-tree build
        # A fresh clone has no gitignored vendor assets; the default build
        # must compile and test without them (delivery tag embeds them).
        run: |
          rm -rf /tmp/clean-egress
          mkdir -p /tmp/clean-egress
          git ls-files | tar -T - -c | tar -x -C /tmp/clean-egress
          cd /tmp/clean-egress
          go build ./... && go vet ./... && go test -count=1 ./...

  bypass-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: check
        run: |
          cd bypass-server
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -count=1 ./...

  socksrelay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: check
        run: |
          cd socksrelay
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -count=1 ./...

  updateserver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: check
        run: |
          cd updateserver
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -count=1 ./...

  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json
      - name: install
        run: npm ci
        working-directory: gui/frontend
      - name: check
        run: npm run check
        working-directory: gui/frontend
      - name: build
        run: npm run build
        working-directory: gui/frontend

  dnscloak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: check
        run: |
          cd dnscloak
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -count=1 ./...
