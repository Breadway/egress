[package]
name = "egress-gui"
version = "0.5.7"
description = "User app for egress private networking"
authors = ["Breadway"]
edition = "2021"

[lib]
# Unique lib name so the library and binary do not collide on Windows.
name = "egress_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Default-on so `cargo build --release` embeds the built frontend;
# `cargo tauri dev` turns it off so the webview talks to the Vite server.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
